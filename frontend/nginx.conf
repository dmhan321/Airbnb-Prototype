server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Handle React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxies
    # Maps /api/traveler/* to http://traveler-service:5001/api/*
    location /api/traveler/ {
        proxy_pass http://traveler-service.airbnb.svc.cluster.local:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/traveler {
        return 301 /api/traveler/;
    }

    # Maps /api/owner/* to http://owner-service:5002/api/*
    location /api/owner/ {
        proxy_pass http://owner-service.airbnb.svc.cluster.local:5002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/owner {
        return 301 /api/owner/;
    }

    # Maps /api/property/* to http://property-service:5003/api/*
    location /api/property/ {
        proxy_pass http://property-service.airbnb.svc.cluster.local:5003/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/property {
        return 301 /api/property/;
    }

    # Maps /api/booking/* to http://booking-service:5004/api/*
    location /api/booking/ {
        proxy_pass http://booking-service.airbnb.svc.cluster.local:5004/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/booking {
        return 301 /api/booking/;
    }

    # Proxy uploads to property service (for property photos)
    # Use ^~ modifier to give priority over regex locations
    location ^~ /uploads/property-photos/ {
        proxy_pass http://property-service.airbnb.svc.cluster.local:5003/uploads/property-photos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy uploads to traveler service (for profile pictures)
    location ^~ /uploads/profile-pictures/ {
        proxy_pass http://traveler-service.airbnb.svc.cluster.local:5001/uploads/profile-pictures/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy uploads to owner service (for owner profile pictures)
    location ^~ /uploads/owner-profile/ {
        proxy_pass http://owner-service.airbnb.svc.cluster.local:5002/uploads/owner-profile/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets (won't match /uploads/ because of ^~ above)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}


