apiVersion: v1
kind: Secret
metadata:
  name: airbnb-secrets
  namespace: airbnb
type: Opaque
stringData:
  # JWT Secret - CHANGE THIS IN PRODUCTION!
  JWT_SECRET: "airbnb-secret-key-change-in-production"
  
  # OpenAI API Key (for agent-backend)
  OPENAI_API_KEY: "your-openai-api-key-here"

---
# Note: In production, use sealed-secrets or external secret management
# To create this secret manually:
# kubectl create secret generic airbnb-secrets \
#   --from-literal=JWT_SECRET=your-secret-key \
#   --from-literal=OPENAI_API_KEY=your-api-key \
#   --namespace=airbnb


