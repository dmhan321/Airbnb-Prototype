apiVersion: v1
kind: Service
metadata:
  name: traveler-service
  namespace: airbnb
spec:
  type: ClusterIP
  ports:
    - port: 5001
      targetPort: 5001
      name: http
  selector:
    app: traveler-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traveler-service
  namespace: airbnb
spec:
  replicas: 4
  selector:
    matchLabels:
      app: traveler-service
  template:
    metadata:
      labels:
        app: traveler-service
    spec:
      containers:
      - name: traveler-service
        image: 982534379272.dkr.ecr.us-west-2.amazonaws.com/airbnb-lab2-repo:traveler-service
        imagePullPolicy: Always
        ports:
        - containerPort: 5001
          name: http
        env:
        - name: PORT
          value: "5001"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: airbnb-secrets
              key: MONGODB_URI
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: airbnb-secrets
              key: JWT_SECRET
        - name: JWT_EXPIRES_IN
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: JWT_EXPIRES_IN
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: FRONTEND_URL
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: NODE_ENV
        - name: KAFKA_BROKER
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: KAFKA_BROKER
        - name: KAFKA_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: KAFKA_CLIENT_ID
        - name: PUBLIC_TRAVELER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: PUBLIC_TRAVELER_SERVICE_URL
        - name: UPLOADS_DIR
          value: "/app/uploads"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: traveler-uploads-pvc


