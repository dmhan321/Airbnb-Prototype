apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-create-topics
  namespace: kafka
spec:
  template:
    spec:
      containers:
      - name: kafka-topics
        image: confluentinc/cp-kafka:7.5.0
        command:
        - sh
        - -c
        - |
          echo "Waiting for Kafka to be ready..."
          sleep 30
          echo "Creating topics..."
          kafka-topics --bootstrap-server kafka.kafka.svc.cluster.local:9092 --create --if-not-exists --topic booking-requests --partitions 3 --replication-factor 1
          kafka-topics --bootstrap-server kafka.kafka.svc.cluster.local:9092 --create --if-not-exists --topic booking-status-updates --partitions 3 --replication-factor 1
          kafka-topics --bootstrap-server kafka.kafka.svc.cluster.local:9092 --create --if-not-exists --topic property-updates --partitions 3 --replication-factor 1
          echo "Listing topics..."
          kafka-topics --bootstrap-server kafka.kafka.svc.cluster.local:9092 --list
      restartPolicy: Never
  backoffLimit: 4

