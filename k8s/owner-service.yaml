apiVersion: v1
kind: Service
metadata:
  name: owner-service
  namespace: airbnb
spec:
  type: ClusterIP
  ports:
    - port: 5002
      targetPort: 5002
      name: http
  selector:
    app: owner-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: owner-service
  namespace: airbnb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: owner-service
  template:
    metadata:
      labels:
        app: owner-service
    spec:
      containers:
      - name: owner-service
        image: 982534379272.dkr.ecr.us-west-2.amazonaws.com/airbnb-lab2-repo:owner-service
        imagePullPolicy: Always
        ports:
        - containerPort: 5002
          name: http
        env:
        - name: PORT
          value: "5002"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: airbnb-secrets
              key: MONGODB_URI
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: airbnb-secrets
              key: JWT_SECRET
        - name: JWT_EXPIRES_IN
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: JWT_EXPIRES_IN
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: FRONTEND_URL
        - name: PROPERTY_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: PROPERTY_SERVICE_URL
        - name: BOOKING_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: BOOKING_SERVICE_URL
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: NODE_ENV
        - name: KAFKA_BROKER
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: KAFKA_BROKER
        - name: KAFKA_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: KAFKA_CLIENT_ID
        - name: PUBLIC_OWNER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: PUBLIC_OWNER_SERVICE_URL
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: owner-uploads-pvc


