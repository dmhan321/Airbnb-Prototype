apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: airbnb
spec:
  type: ClusterIP
  ports:
    - port: 5004
      targetPort: 5004
      name: http
  selector:
    app: booking-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: airbnb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
      - name: booking-service
        image: airbnb-prototype-booking-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5004
          name: http
        env:
        - name: PORT
          value: "5004"
        - name: MONGODB_URI
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: MONGODB_URI
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: airbnb-secrets
              key: JWT_SECRET
        - name: JWT_EXPIRES_IN
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: JWT_EXPIRES_IN
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: FRONTEND_URL
        - name: PROPERTY_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: PROPERTY_SERVICE_URL
        - name: BOOKING_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: BOOKING_SERVICE_URL
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: NODE_ENV
        - name: KAFKA_BROKER
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: KAFKA_BROKER
        - name: KAFKA_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: airbnb-config
              key: KAFKA_CLIENT_ID
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5004
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 5004
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3


