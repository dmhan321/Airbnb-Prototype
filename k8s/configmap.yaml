apiVersion: v1
kind: ConfigMap
metadata:
  name: airbnb-config
  namespace: airbnb
data:
  # MongoDB Configuration
  MONGODB_URI: "mongodb://mongodb-service:27017/airbnb_db"
  DB_NAME: "airbnb_db"
  
  # JWT Configuration
  JWT_EXPIRES_IN: "7d"
  
  # Service URLs (for inter-service communication)
  PROPERTY_SERVICE_URL: "http://property-service:5003"
  BOOKING_SERVICE_URL: "http://booking-service:5004"
  TRAVELER_SERVICE_URL: "http://traveler-service:5001"
  OWNER_SERVICE_URL: "http://owner-service:5002"
  
  # Public URLs (for browser access - use localhost with port-forward)
  PUBLIC_PROPERTY_SERVICE_URL: "http://localhost:5003"
  PUBLIC_TRAVELER_SERVICE_URL: "http://localhost:5001"
  PUBLIC_OWNER_SERVICE_URL: "http://localhost:5002"
  
  # Frontend URL (for CORS)
  FRONTEND_URL: "http://localhost:3000"
  
  # Kafka Configuration
  KAFKA_BROKER: "kafka.kafka.svc.cluster.local:9092"
  KAFKA_CLIENT_ID: "airbnb-app"
  
  # Environment
  NODE_ENV: "production"


