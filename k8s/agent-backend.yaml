apiVersion: v1
kind: Service
metadata:
  name: agent-backend
  namespace: airbnb
spec:
  type: ClusterIP
  ports:
    - port: 5005
      targetPort: 5005
      name: http
  selector:
    app: agent-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-backend
  namespace: airbnb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-backend
  template:
    metadata:
      labels:
        app: agent-backend
    spec:
      containers:
      - name: agent-backend
        image: airbnb-prototype-agent-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5005
          name: http
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: airbnb-secrets
              key: OPENAI_API_KEY
        - name: AGENT_PORT
          value: "5005"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5005
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 5005
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3


